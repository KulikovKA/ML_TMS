services:
  # --- ТВОЯ БАЗА С КИНО (PGVECTOR) ---
  db:
    image: pgvector/pgvector:pg16
    container_name: movie_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: movies_db
    networks:
      - movie_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d movies_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- AIRFLOW ИНФРАСТРУКТУРА ---
  airflow-db:
    image: postgres:16
    container_name: airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    networks:
      - movie_network

  airflow-redis:
    image: redis:7.2-bookworm
    container_name: airflow-redis
    networks:
      - movie_network

  # ВАЖНО: В Airflow 3 команда 'webserver' заменена на 'api-server'
  airflow-webserver:
    image: apache/airflow:3.1.8
    container_name: airflow-webserver
    command: api-server
    ports:
      - "8081:8080"
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://:@airflow-redis:6379/0
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: airflow_jwt_secret_for_local_dev_please_change
      MOVIES_DB_URL: postgresql://postgres:admin@db:5432/movies_db
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      _PIP_ADDITIONAL_DEPENDENCIES: "pandas sqlalchemy psycopg2-binary"
    depends_on:
      - airflow-db
    networks:
      - movie_network

  airflow-scheduler:
    image: apache/airflow:3.1.8
    container_name: airflow-scheduler
    command: scheduler
    environment: *airflow-env
    depends_on:
      - airflow-db
    networks:
      - movie_network

  airflow-worker:
    image: apache/airflow:3.1.8
    container_name: airflow-worker
    command: celery worker
    environment: *airflow-env
    depends_on:
      - airflow-db
      - airflow-redis
    networks:
      - movie_network

  airflow-init:
    image: apache/airflow:3.1.8
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username airflow --password airflow --firstname airflow --lastname airflow --role Admin --email admin@example.com
    environment: *airflow-env
    networks:
      - movie_network

  # --- АНАЛИТИКА ---
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.2
    container_name: movie_mlflow
    ports:
      - "5001:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://postgres:admin@movie_postgres:5432/movies_db
    networks:
      - movie_network

  grafana:
    image: grafana/grafana:latest
    container_name: movie_grafana
    ports:
      - "3001:3000"
    networks:
      - movie_network

networks:
  movie_network:
    driver: bridge

volumes:
  postgres_data: